spring.application.name=notepilot
server.port=${PORT:${SERVER_PORT:8080}}
server.error.include-stacktrace=never
hf.token=${HF_TOKEN:}
hf.model=${HF_MODEL:deepseek-ai/DeepSeek-V4.1-Flash}
hf.url=${HF_API_URL:https://router.huggingface.co/v1/chat/completions}
hf.timeout-seconds=${HF_TIMEOUT_SECONDS:60}
app.cors.origins=${CORS_ORIGINS:http://127.0.0.1:5500,http://localhost:5500}
app.max-chars=${MAX_INPUT_CHARS:20000}
